    cs.setMarkers(payload.markers);
    payload.resistanceLines.forEach((line, idx) => {
      const resistance = chart.addLineSeries({
        color: idx === payload.resistanceLines.length - 1 ? '#a855f7' : 'rgba(168,85,247,0.45)',
        lineWidth: idx === payload.resistanceLines.length - 1 ? 2 : 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        priceLineVisible: false,
        lastValueVisible: idx === payload.resistanceLines.length - 1,
      });
      resistance.setData(line.points);
    });
    const vs = chart.addHistogramSeries({ priceScaleId: 'volume', priceFormat: { type: 'volume' } });
    chart.priceScale('volume').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    vs.setData(payload.volumes);
    chart.timeScale().fitContent();
    window.addEventListener('resize', () => chart.applyOptions({ width: el.clientWidth }));
  })();
  </script>
</body>
</html>
